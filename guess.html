<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>数当てゲーム</title>

    <style>
        .container {
            background: #f5f5f5;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        #guessInput {
            padding: 8px;
            width: 20%;
        }

        button {
             padding: 8px 12px;
            cursor: pointer;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数当てゲーム</h1>
        <p>1～100までの数字を当ててね</p>

        <input id="guessInput" type="number" min="1" max="100">
        <button id="guessBtn">答える</button>
        <button id="resetBtn">もう一度</button>

        <p id="message"></p>

        <a href="3index.html">自己紹介ページに戻る</a>
        <script src="guess.js"></script>
    </div>
</body>
</html>
