<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>メモ</title>
    </head>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 40px 20px;
    color: #333;
}

/* タイトル */
h1 {
    text-align: center;
    margin-bottom: 30px;
}

/* 入力欄 */
input {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}
.memo-input {
    text-align: center;
}

/* 入力欄フォーカス */
input:focus {
    border-color: #5267d9;
}

/* ボタン共通 */
button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #5267d9;
    color: white;
    transition: 0.2s;
}

/* ボタンにマウスを乗せた時 */
button:hover {
    opacity: 0.8;
}

/* メモ一覧 */
#memoList {
    list-style: none;
    padding: 0;
    max-width: 500px;
    margin: 25px auto;
}

/* メモ1つずつ */
#memoList li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: white;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}

/* メモの文字 */
#memoList span {
    flex: 1;
    overflow-wrap: anywhere;
}

/* 削除ボタン */
#memoList button:last-child {
    background: #e05252;
}
.link {
    text-align: center;
}
    </style>
    <body>
        <h1>メモ</h1>
        <div class="memo-input">
        <input id="memo" type="text" placeholder="入力………">
        <button id="addBtn">追加</button>
        </div>
        <ul id="memoList"></ul>
        <p class="link"><a href="index.html">自己紹介ページ</a></p>
        <script src="pinmemo.js"></script>
    </body>
</html>
